async function muat(){

const hasil =
await supabaseClient
.from("posts")
.select("*")
.order("created_at",{ascending:false});

if(hasil.error){

document.getElementById("daftar").innerHTML =
"Gagal memuat: "+hasil.error.message;

return;
}

let html="";

hasil.data.forEach(p=>{

html+=`
<div class="bg-white p-4 rounded-xl shadow mb-4">

<b class="text-blue-600">
${p["user-name"]||"Tanpa nama"}
</b>

<p class="text-xs text-gray-500">
${new Date(p.created_at).toLocaleString("id-ID")}
</p>

<p class="mt-3 whitespace-pre-wrap">
${p.content||""}
</p>

${p.image_url ?
`<img src="${p.image_url}"
class="w-full rounded-xl mt-3">`
:""}

</div>
`;

});

document.getElementById("daftar").innerHTML =
html || "Belum ada kabar.";

}
