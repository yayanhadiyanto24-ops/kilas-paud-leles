<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilas PAUD - Kecamatan Leles</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome CDN -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
body { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-20">
​<!-- Header -->
<header class="bg-amber-400 border-b-2 border-amber-500 sticky top-0 z-50 shadow-sm">
<div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
<h1 class="text-lg font-bold text-slate-900 flex items-center gap-2">
<i class="fa-solid fa-newspaper text-amber-900"></i> Kilas PAUD Leles
</h1>
</div>
</header>
​<main class="max-w-xl mx-auto px-4 pt-4 space-y-4">
​<!-- Form Posting -->
<div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
<h2 class="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
<i class="fa-solid fa-pen-to-square text-amber-500"></i> Buat Postingan Baru
</h2>
<form id="formPosting" class="space-y-3">
<textarea 
id="inputPosting" 
rows="3" 
placeholder="Tulis informasi atau kegiatan PAUD di sini..." 
class="w-full p-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 text-sm resize-none"
required></textarea>
<div class="flex justify-between items-center">
<span id="pesanSukses" class="text-xs text-green-600 font-semibold hidden">
<i class="fa-solid fa-circle-check"></i> Berhasil diposting!
</span>
<button 
type="submit" 
class="ml-auto bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-semibold text-sm px-4 py-2 rounded-lg transition-all flex items-center gap-2 shadow">
<i class="fa-solid fa-paper-plane"></i> Posting
</button>
</div>
</form>
</div>
​<!-- Area Daftar Postingan -->
<div>
<h2 class="text-sm font-semibold text-slate-700 mb-2 flex items-center gap-2">
<i class="fa-solid fa-bullhorn text-amber-500"></i> Kabar Terbaru
</h2>
<div id="daftarPostingan" class="space-y-3">
<!-- Postingan akan dimuat dinamis di sini -->
</div>
</div>
​</main>
​<!-- Logika Penyimpanan LocalStorage -->
<script>
document.addEventListener('DOMContentLoaded', function() {
const formPosting = document.getElementById('formPosting');
const inputPosting = document.getElementById('inputPosting');
const daftarPostingan = document.getElementById('daftarPostingan');
const pesanSukses = document.getElementById('pesanSukses');
​// Fungsi untuk menampilkan postingan yang tersimpan di LocalStorage
function muatPostingan() {
const dataTersimpan = JSON.parse(localStorage.getItem('kilas_paud_posts') || '[]');
daftarPostingan.innerHTML = '';
​if (dataTersimpan.length === 0) {
daftarPostingan.innerHTML = <div class="bg-white p-6 rounded-xl text-center text-slate-400 text-sm border border-slate-200"> Belum ada postingan. Silakan buat postingan pertama Anda di atas! </div>;
return;
}
​dataTersimpan.forEach((item, index) => {
const kartuPost = document.createElement('div');
kartuPost.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 relative';
kartuPost.innerHTML = <div class="flex justify-between items-start mb-2"> <span class="text-xs font-semibold text-amber-700 bg-amber-100 px-2 py-0.5 rounded">Pengumuman</span> <span class="text-xs text-slate-400">${item.waktu}</span> </div> <p class="text-slate-800 text-sm whitespace-pre-line leading-relaxed">${item.teks}</p> <button onclick="hapusPost(${index})" class="text-xs text-red-500 hover:text-red-700 font-medium mt-3 flex items-center gap-1 ml-auto"> <i class="fa-solid fa-trash-can"></i> Hapus </button>;
daftarPostingan.appendChild(kartuPost);
});
}
​// Handler kirim form posting
formPosting.addEventListener('submit', function(e) {
e.preventDefault();
const teks = inputPosting.value.trim();
if (!teks) return;
​const postingBaru = {
teks: teks,
waktu: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })
};
​const dataTersimpan = JSON.parse(localStorage.getItem('kilas_paud_posts') || '[]');
dataTersimpan.unshift(postingBaru);
localStorage.setItem('kilas_paud_posts', JSON.stringify(dataTersimpan));
​inputPosting.value = '';
​// Tampilkan indikator sukses
pesanSukses.classList.remove('hidden');
setTimeout(() => pesanSukses.classList.add('hidden'), 2000);
​muatPostingan();
});
​// Fungsi hapus postingan
window.hapusPost = function(index) {
if (confirm('Yakin ingin menghapus postingan ini?')) {
const dataTersimpan = JSON.parse(localStorage.getItem('kilas_paud_posts') || '[]');
dataTersimpan.splice(index, 1);
localStorage.setItem('kilas_paud_posts', JSON.stringify(dataTersimpan));
muatPostingan();
}
};
​// Inisialisasi awal saat halaman dibuka
muatPostingan();
});
</script>
​</body>
</html>
