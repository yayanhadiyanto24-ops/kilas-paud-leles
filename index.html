
<style>
/* Perbaikan tampilan ringkas KIPA Leles */
.topbar-search {
  max-width: 760px;
  margin: auto;
  padding: 0 12px 9px;
}
.topbar-search .search-row { margin: 0; }
.topbar-search input { background: #fff; }
.panel-toggle {
  margin-left: auto;
  flex-shrink: 0;
  border: 1px solid #d9e8dd;
  background: #f3faf5;
  color: #10683a;
  border-radius: 9px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 700;
}
.card-title { flex-wrap: wrap; }
.collapsible-body[hidden] { display: none !important; }
@media(max-width:420px) {
  .brand h1 { font-size: 17px; }
  .brand p { font-size: 10px; }
  .brand-mark { width: 36px; height: 36px; }
  .top-inner { gap: 7px; padding: 8px 10px; }
}
</style>
<script>
(function () {
  // Pindahkan pencarian ke header, dekat lonceng.
  const search = document.querySelector('.search-row');
  const header = document.querySelector('.topbar');
  if (search && header) {
    const wrap = document.createElement('div');
    wrap.className = 'topbar-search';
    wrap.appendChild(search);
    header.appendChild(wrap);
  }

  // Buat panel utama bisa dibuka dan ditutup.
  function buatPanel(judul, isi, mulaiTertutup) {
    const title = document.getElementById(judul);
    const content = document.getElementById(isi);
    if (!title || !content || title.dataset.toggleReady) return;
    title.dataset.toggleReady = '1';

    const body = document.createElement('div');
    body.className = 'collapsible-body';
    content.parentNode.insertBefore(body, content);
    body.appendChild(content);

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'panel-toggle';
    button.textContent = mulaiTertutup ? 'Buka +' : 'Tutup −';
    button.setAttribute('aria-expanded', String(!mulaiTertutup));
    title.appendChild(button);

    if (mulaiTertutup) body.hidden = true;

    button.addEventListener('click', function () {
      body.hidden = !body.hidden;
      button.textContent = body.hidden ? 'Buka +' : 'Tutup −';
      button.setAttribute('aria-expanded', String(!body.hidden));
    });
  }

  // Bungkus isi setiap panel tanpa menghapus fungsinya.
  function siapkanPanel(idJudul, pilihIsi, tertutup) {
    const title = document.getElementById(idJudul);
    if (!title || title.dataset.toggleReady) return;
    const card = title.closest('.card');
    if (!card) return;
    const isi = card.querySelector(pilihIsi);
    if (!isi) return;

    title.dataset.toggleReady = '1';
    const body = document.createElement('div');
    body.className = 'collapsible-body';
    isi.parentNode.insertBefore(body, isi);

    // Pindahkan seluruh isi panel ke wadah yang dapat ditutup.
    if (idJudul === 'judulAkun') {
      body.appendChild(document.getElementById('authForm'));
      body.appendChild(document.getElementById('authLoggedIn'));
    } else {
      body.appendChild(isi);
    }

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'panel-toggle';
    button.textContent = tertutup ? 'Buka +' : 'Tutup −';
    button.setAttribute('aria-expanded', String(!tertutup));
    title.appendChild(button);
    body.hidden = tertutup;

    button.addEventListener('click', function () {
      body.hidden = !body.hidden;
      button.textContent = body.hidden ? 'Buka +' : 'Tutup −';
      button.setAttribute('aria-expanded', String(!body.hidden));
    });
  }

  siapkanPanel('judulAkun', '#authForm', true);
  siapkanPanel('judulPeringkat', '.rank-placeholder', true);
  siapkanPanel('judulPosting', '.form-grid', true);

  // Tombol tutup khusus daftar anggota admin.
  const admin = document.getElementById('adminMembers');
  if (admin && !document.getElementById('tutupAdminMembers')) {
    const btn = document.createElement('button');
    btn.id = 'tutupAdminMembers';
    btn.type = 'button';
    btn.className = 'panel-toggle';
    btn.textContent = 'Tutup daftar';
    btn.style.marginTop = '8px';
    btn.addEventListener('click', function () {
      admin.style.display = 'none';
    });
    admin.appendChild(btn);
  }
})();
</script>
</body>
</html>
