<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilas PAUD Kecamatan Leles</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef3f7;
  color:#263238
}
.header{
  background:linear-gradient(135deg,#0d8bdc,#19b56b);
  color:white;
  padding:12px 10px;
  text-align:center;
  box-shadow:0 2px 8px #0002
}
.header h1{margin:0;font-size:21px}
.header p{margin:7px 0 0;font-size:14px}
.container{
  max-width:720px;
  margin:auto;
  padding:8px
}
.card{
  background:white;
  border-radius:12px;
  padding:12px;
  margin-bottom:10px;
  box-shadow:0 2px 8px #0001
}
h2{
  margin-top:0;
  margin-bottom:10px;
  font-size:18px
}
label{
  display:block;
  font-weight:bold;
  margin-top:10px;
  margin-bottom:5px
}
input,textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccd6dd;
  border-radius:8px;
  font-size:15px;
  font-family:inherit
}
textarea{
  min-height:44px;
  resize:vertical
  overflow-y:hidden
}
button{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:0;
  border-radius:8px;
  background:#12a85a;
  color:white;
  font-size:15px;
  font-weight:bold
}
button:active{opacity:.8}
.status{
  text-align:center;
  margin-top:12px;
  font-weight:bold
}
.post{
  border-top:1px solid #e1e7eb;
  padding-top:16px;
  margin-top:16px
}
.post:first-child{
  border-top:0;
  margin-top:0;
  padding-top:0
}
.nama{
  font-size:17px;
  font-weight:bold;
  color:#087fbe
}
.tanggal{
  font-size:12px;
  color:#718096;
  margin-top:4px
}
.kabar{
  margin-top:10px;
  line-height:1.55;
  white-space:pre-wrap
}
.post img{
  width:100%;
  margin-top:12px;
  border-radius:12px;
  display:block
}
.empty{
  text-align:center;
  color:#718096;
  padding:20px 5px
}
</style>
</head>

<body>

<div class="header">
  <h1>🌿 Kilas PAUD Kecamatan Leles</h1>
  <p>Berbagi kabar, kegiatan, dan informasi PAUD</p>
  <p>Penilik: Yayan Hadiyanto, S.Pd.-MT.</p>
</div>

<div class="container">

  <div class="card">
    <h2>📢 Posting Kabar</h2>

    <label>Nama / Lembaga</label>
    <input id="nama" placeholder="Contoh: PAUD Melati">

    <label>Kabar</label>
    <textarea id="isi" placeholder="Tuliskan kabar atau kegiatan PAUD..."></textarea>

    <label>Foto (opsional)</label>
    <input id="foto" type="file" accept="image/*">

    <label>PIN (opsional)</label>
    <input id="pin" type="text" placeholder="PIN posting">

    <button type="button" onclick="posting()">POSTING KABAR</button>

    <div id="pesan" class="status"></div>
  </div>

  <div class="card">
    <h2>📰 Kabar Terbaru</h2>
    <div id="daftar">Memuat kabar...</div>
  </div>

</div>

<script>

const SUPABASE_URL =
"https://hyiwkftkwacbiowooulp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lamtyGaC7AQgNTUUUb9hsQ_ebFjuB4z";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
  
const kolomKabar = document.getElementById("isi");

kolomKabar.addEventListener("input", function(){
  this.style.height = "auto";
  this.style.height = this.scrollHeight + "px";
});

async function posting(){

  const pesan =
    document.getElementById("pesan");

  const nama =
    document.getElementById("nama").value.trim();

  const isi =
    document.getElementById("isi").value.trim();

  const pin =
    document.getElementById("pin").value.trim();

  const file =
    document.getElementById("foto").files[0];


  if(!nama || !isi){
    pesan.textContent =
      "Nama dan kabar harus diisi.";
    return;
  }


  pesan.textContent =
    "Sedang mengirim...";


  let fotoUrl = "";


  try{

    /* UPLOAD FOTO */

    if(file){

      const namaFile =
        Date.now()+"-"+file.name;

      const upload =
        await db.storage
        .from("post-images")
        .upload(namaFile,file);

      if(upload.error){

        pesan.textContent =
          "Gagal upload foto: "+
          upload.error.message;

        return;
      }


      const url =
        db.storage
        .from("post-images")
        .getPublicUrl(namaFile);

      fotoUrl =
        url.data.publicUrl;
    }


    /* SIMPAN KE DATABASE */

    const simpan =
      await db
      .from("posts")
      .insert([{
        username:nama,
        content:isi,
        image_url:fotoUrl,
        pin:pin
      }]);


    if(simpan.error){

      pesan.textContent =
        "Gagal menyimpan: "+
        simpan.error.message;

      return;
    }


    pesan.textContent =
      "✅ Kabar berhasil diposting!";


    document.getElementById("nama").value="";
    document.getElementById("isi").value="";
    document.getElementById("foto").value="";
    document.getElementById("pin").value="";


    muat();

  }catch(error){

    pesan.textContent =
      "Terjadi kesalahan: "+
      error.message;

  }

}


async function muat(){

  const daftar =
    document.getElementById("daftar");


  const hasil =
    await db
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false, nullsFirst:false});


  if(hasil.error){

    daftar.innerHTML =
      "<div class='empty'>"+
      "Gagal memuat kabar: "+
      hasil.error.message+
      "</div>";

    return;
  }


  if(!hasil.data || hasil.data.length===0){

    daftar.innerHTML =
      "<div class='empty'>"+
      "Belum ada kabar."+
      "</div>";

    return;
  }


  daftar.innerHTML="";


  [...hasil.data].sort((a,b) =>
  new Date(b.created_at || 0) - new Date(a.created_at || 0)
).forEach(post=>{

    const div =
      document.createElement("div");

    div.className="post";


    const nama =
      escapeHtml(post.username || "");

    const isi =
      escapeHtml(post.content || "");

    const tanggal =
      post.created_at
      ? new Date(post.created_at)
        .toLocaleString("id-ID",{
          dateStyle:"medium",
          timeStyle:"short"
        })
      : "";


    let html =
      "<div class='nama'>"+
      nama+
      "</div>";


    html +=
      "<div class='tanggal'>"+
      tanggal+
      "</div>";


    html +=
      "<div class='kabar'>"+
      isi+
      "</div>";


    if(post.image_url){

      html +=
        "<img src='"+
        escapeAttribute(post.image_url)+
        "' alt='Foto kegiatan PAUD'>";
    }


    div.innerHTML=html;

    daftar.appendChild(div);

  });

}


function escapeHtml(teks){

  return String(teks)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(teks){

  return String(teks)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


muat();

</script>

</body>
  </html>
