<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kilas PAUD Kecamatan Leles</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f1f5f9;
  color:#1e293b;
}
.header{
  background:linear-gradient(135deg,#0ea5e9,#22c55e);
  color:white;
  padding:25px 15px;
  text-align:center;
}
.header h1{margin:0;font-size:26px}
.header p{margin:8px 0 0}
.container{
  max-width:700px;
  margin:20px auto;
  padding:0 12px;
}
.card{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}
input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:15px;
}
textarea{
  min-height:110px;
  resize:vertical;
}
button{
  width:100%;
  padding:13px;
  border:0;
  border-radius:9px;
  background:#16a34a;
  color:white;
  font-size:16px;
  font-weight:bold;
}
button:active{background:#15803d}
.status{
  margin-top:12px;
  font-weight:bold;
  text-align:center;
}
.post{
  border-top:1px solid #e2e8f0;
  padding-top:15px;
  margin-top:15px;
}
.post img{
  width:100%;
  border-radius:10px;
  margin-top:10px;
}
.nama{
  font-weight:bold;
  color:#0284c7;
}
.tanggal{
  font-size:12px;
  color:#64748b;
  margin-top:4px;
}
.kabar{
  white-space:pre-wrap;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">
  <h1>Kilas PAUD Kecamatan Leles</h1>
  <p>Berbagi kabar dan kegiatan PAUD</p>
</div>

<div class="container">

  <div class="card">
    <h2>Posting Kabar</h2>

    <label>Nama / Lembaga</label>
    <input id="nama" type="text" placeholder="Contoh: PAUD Melati">

    <label>Kabar</label>
    <textarea id="isi" placeholder="Tulis kabar atau kegiatan..."></textarea>

    <label>Foto (opsional)</label>
    <input id="foto" type="file" accept="image/*">

    <label>PIN (opsional)</label>
    <input id="pin" type="text" placeholder="PIN">

    <button type="button" onclick="posting()">POSTING KABAR</button>

    <div id="pesan" class="status"></div>
  </div>

  <div class="card">
    <h2>Kabar Terbaru</h2>
    <div id="daftar">Memuat kabar...</div>
  </div>

</div>

<script>
alert("TES JAVASCRIPT BERHASIL");
  
const SUPABASE_URL =
"https://hyiwkftkwacbiowooulp.supabase.co";

/* GANTI TEKS DI BAWAH DENGAN PUBLISHABLE KEY ANDA */
const SUPABASE_KEY =
"sb_publishable_lamtyGaC7AQgNTUUUb9hsQ_ebFjuB4z";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function posting(){

  const pesan = document.getElementById("pesan");

  const nama =
    document.getElementById("nama").value.trim();

  const isi =
    document.getElementById("isi").value.trim();

  const pin =
    document.getElementById("pin").value.trim();

  const file =
    document.getElementById("foto").files[0];

  if(!nama || !isi){

    pesan.textContent =
      "Nama dan kabar harus diisi.";

    return;
  }

  pesan.textContent = "Sedang mengirim...";

  let fotoUrl = "";

  try{

    if(file){

      const namaFile =
        Date.now()+"-"+file.name;

      const upload =
        await supabaseClient
        .storage
        .from("post-images")
        .upload(namaFile,file);

      if(upload.error){

        pesan.textContent =
          "Gagal upload foto: "+
          upload.error.message;

        return;
      }

      const publicUrl =
        supabaseClient
        .storage
        .from("post-images")
        .getPublicUrl(namaFile);

      fotoUrl =
        publicUrl.data.publicUrl;
    }


    const simpan =
      await supabaseClient
      .from("posts")
      .insert([{

        "user-name": nama,
        "content": isi,
        "image_url": fotoUrl,
        "pin": pin

      }]);


    if(simpan.error){

      pesan.textContent =
        "Gagal menyimpan: "+
        simpan.error.message;

      return;
    }


    pesan.textContent =
      "Kabar berhasil diposting!";

    document.getElementById("nama").value = "";
    document.getElementById("isi").value = "";
    document.getElementById("pin").value = "";
    document.getElementById("foto").value = "";

    muat();

  }catch(error){

    pesan.textContent =
      "Terjadi kesalahan: "+
      error.message;

  }

}


async function muat(){

  const daftar =
    document.getElementById("daftar");

  const hasil =
    await supabaseClient
    .from("posts")
    .select("*")
    .order("created_at",{ascending:false});


  if(hasil.error){

    daftar.textContent =
      "Gagal memuat kabar: "+
      hasil.error.message;

    return;
  }


  if(!hasil.data || hasil.data.length === 0){

    daftar.textContent =
      "Belum ada kabar.";

    return;
  }


  daftar.innerHTML = "";


  hasil.data.forEach(post => {

    const div =
      document.createElement("div");

    div.className = "post";


    let html = "";

    html +=
      '<div class="nama">'+
      escapeHtml(post["user-name"] || "")+
      '</div>';

    html +=
      '<div class="tanggal">'+
      formatTanggal(post.created_at)+
      '</div>';

    html +=
      '<div class="kabar">'+
      escapeHtml(post.content || "")+
      '</div>';


    if(post.image_url){

      html +=
        '<img src="'+
        escapeAttribute(post.image_url)+
        '" alt="Foto postingan">';
    }


    div.innerHTML = html;

    daftar.appendChild(div);

  });

}


function formatTanggal(tanggal){

  if(!tanggal) return "";

  return new Date(tanggal)
    .toLocaleString("id-ID",{
      dateStyle:"medium",
      timeStyle:"short"
    });

}


function escapeHtml(teks){

  return String(teks)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(teks){

  return String(teks)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


muat();

</script>

</body>
</html>
