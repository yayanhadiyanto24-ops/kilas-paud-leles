<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kilas PAUD - Kecamatan Leles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20">

  <!-- Header / Navigation -->
  <header class="bg-amber-400 border-b-2 border-amber-500 sticky top-0 z-50 shadow-sm">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-9 h-9 bg-slate-900 text-amber-400 rounded-lg flex items-center justify-center font-bold text-lg">
          <i class="fa-solid fa-child-reaching"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">Kilas PAUD Leles</h1>
          <p class="text-[10px] text-slate-800 font-medium">Informasi & Kegiatan PAUD DIKMAS</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 pt-4 space-y-4">

    <!-- Statistik Ringkas -->
    <div class="grid grid-cols-3 gap-2">
      <div class="bg-white p-3 rounded-xl border border-slate-200 text-center shadow-sm">
        <span id="statTotal" class="block text-lg font-bold text-slate-800">0</span>
        <span class="text-[11px] text-slate-500">Total Kabar</span>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 text-center shadow-sm">
        <span id="statPengumuman" class="block text-lg font-bold text-amber-600">0</span>
        <span class="text-[11px] text-slate-500">Pengumuman</span>
      </div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 text-center shadow-sm">
        <span id="statKegiatan" class="block text-lg font-bold text-blue-600">0</span>
        <span class="text-[11px] text-slate-500">Kegiatan</span>
      </div>
    </div>
    
    <!-- Form Buat Postingan Baru -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-sm font-bold text-slate-800 mb-3 flex items-center gap-2">
        <i class="fa-solid fa-pen-to-square text-amber-500"></i> Buat Postingan Baru
      </h2>
      <div class="space-y-3">
        <!-- Kategori & Judul/Lembaga -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Kategori</label>
            <select id="inputKategori" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-amber-400 outline-none">
              <option value="Pengumuman">📢 Pengumuman</option>
              <option value="Kegiatan">🎨 Kegiatan PAUD</option>
              <option value="Prestasi">🏆 Prestasi</option>
              <option value="Info">ℹ️ Informasi Umum</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-1">Nama Lembaga / Penulis</label>
            <input id="inputPenulis" type="text" placeholder="Misal: PAUD Kenanga" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-amber-400 outline-none">
          </div>
        </div>

        <!-- Isi Pesan -->
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Isi Berita / Informasi</label>
          <textarea 
            id="inputPosting" 
            rows="3" 
            placeholder="Tuliskan informasi atau dokumentasi kegiatan PAUD di sini..." 
            class="w-full p-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 text-xs"></textarea>
        </div>

        <!-- Lampiran Foto (URL/Pilihan) -->
        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-1">Link Foto (Opsional)</label>
          <input id="inputGambar" type="url" placeholder="https://... (Masukkan link gambar jika ada)" class="w-full p-2 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-amber-400 outline-none">
        </div>

        <!-- Tombol Aksi -->
        <div class="flex justify-between items-center pt-1">
          <span id="pesanSukses" class="text-xs text-green-600 font-semibold hidden flex items-center gap-1">
            <i class="fa-solid fa-circle-check"></i> Berhasil diterbitkan!
          </span>
          <button 
            type="button"
            onclick="tambahPost()" 
            class="ml-auto bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs px-4 py-2.5 rounded-lg transition-all shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-paper-plane"></i> Posting Kabar
          </button>
        </div>
      </div>
    </div>

    <!-- Filter & Pencarian -->
    <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm space-y-2">
      <div class="flex items-center gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
          <input id="inputCari" onkeyup="muatPostingan()" type="text" placeholder="Cari kabar atau nama PAUD..." class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:border-amber-400">
        </div>
        <select id="filterKategori" onchange="muatPostingan()" class="p-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none">
          <option value="Semua">Semua Kategori</option>
          <option value="Pengumuman">Pengumuman</option>
          <option value="Kegiatan">Kegiatan</option>
          <option value="Prestasi">Prestasi</option>
          <option value="Info">Informasi</option>
        </select>
      </div>
    </div>

    <!-- Daftar Postingan -->
    <div>
      <div class="flex items-center justify-between mb-2 px-1">
        <h2 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Kabar Terbaru</h2>
      </div>
      <div id="daftarPostingan" class="space-y-3">
        <!-- Postingan muncul di sini -->
      </div>
    </div>

  </main>

  <script>
    function muatPostingan() {
      const daftarPostingan = document.getElementById('daftarPostingan');
      const inputCari = document.getElementById('inputCari').value.toLowerCase();
      const filterKategori = document.getElementById('filterKategori').value;
      
      const dataTersimpan = JSON.parse(localStorage.getItem('kilas_paud_posts') || '[]');
      
      // Update Statistik
      document.getElementById('statTotal').innerText = dataTersimpan.length;
      document.getElementById('statPengumuman').innerText = dataTersimpan.filter(i => i.kategori === 'Pengumuman').length;
      document.getElementById('statKegiatan').innerText = dataTersimpan.filter(i => i.kategori === 'Kegiatan').length;

      daftarPostingan.innerHTML = '';

      // Filter Data
      const dataFiltered = dataTersimpan.filter(item => {
        const cocokKata = (item.teks || '').toLowerCase().includes(inputCari) || (item.penulis || '').toLowerCase().includes(inputCari);
        const cocokKategori = filterKategori === 'Semua' || item.kategori === filterKategori;
        return cocokKata && cocokKategori;
      });

      if (dataFiltered.length === 0) {
        daftarPostingan.innerHTML = `
          <div class="bg-white p-8 rounded-xl text-center text-slate-400 text-xs border border-slate-200">
            <i class="fa-regular fa-folder-open text-2xl mb-2 block text-slate-300"></i>
            Belum ada kabar atau informasi yang cocok ditemukan.
          </div>
        `;
        return;
      }

      dataFiltered.forEach((item, index) => {
        const kartuPost = document.createElement('div');
        kartuPost.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2';
        
        let badgeColor = 'bg-amber-100 text-amber-800 border-amber-200';
        if (item.kategori === 'Kegiatan') badgeColor = 'bg-blue-100 text-blue-800 border-blue-200';
        if (item.kategori === 'Prestasi') badgeColor = 'bg-emerald-100 text-emerald-800 border-emerald-200';
        if (item.kategori === 'Info') badgeColor = 'bg-purple-100 text-purple-800 border-purple-200';

        let gambarHTML = '';
        if (item.gambar) {
          gambarHTML = `<img src="${item.gambar}" alt="Foto Kabar" class="w-full h-48 object-cover rounded-lg border border-slate-100 mt-2" onerror="this.style.display='none'">`;
        }

        kartuPost.innerHTML = `
          <div class="flex justify-between items-center border-b border-slate-100 pb-2">
            <div class="flex items-center gap-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded border ${badgeColor}">
                ${item.kategori || 'Pengumuman'}
              </span>
              <span class="text-xs font-semibold text-slate-700">${item.penulis ? item.penulis : 'Penilik / Pengelola'}</span>
            </div>
            <span class="text-[10px] text-slate-400">${item.waktu}</span>
          </div>
          <p class="text-slate-800 text-xs leading-relaxed whitespace-pre-line">${item.teks}</p>
          ${gambarHTML}
          <div class="flex justify-end pt-2 border-t border-slate-50">
            <button onclick="hapusPost(${index})" class="text-[11px] text-red-500 hover:text-red-700 flex items-center gap-1 font-medium">
              <i class="fa-solid fa-trash-can"></i> Hapus
            </button>
          </div>
        `;
        daftarPostingan.appendChild(kartuPost);
      });
    }

    function tambahPost() {
      const inputPosting = document.getElementById('inputPosting');
      const inputKategori = document.getElementById('inputKategori');
      const inputPenulis = document.getElementById('inputPenulis');
      const inputGambar = document.getElementById('inputGambar');
      const pesanSukses = document.getElementById('pesanSukses');
      
      const teks = inputPosting.value.trim();
      
      if (!teks) {
        alert('Silakan tuliskan isi informasi/kabar terlebih dahulu!');
        return;
      }

      const postingBaru = {
        teks: teks,
        kategori: inputKategori.value,
        penulis: inputPenulis.value.trim(),
        gambar: inputGambar.value.trim(),
        waktu: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' })
      };

      const dataTersimpan = JSON.parse(localStorage.getItem('kilas_paud_posts') || '[]');
      dataTersimpan.unshift(postingBaru);
      localStorage.setItem('kilas_paud_posts', JSON.stringify(dataTersimpan));

      // Reset Form
      inputPosting.value = '';
      inputPenulis.value = '';
      inputGambar.value = '';

      pesanSukses.classList.remove('hidden');
      setTimeout(() => pesanSukses.classList.add('hidden'), 2500);

      muatPostingan();
    }

    function hapusPost(index) {
      if (confirm('Apakah Anda yakin ingin menghapus postingan ini?')) {
        const dataTersimpan = JSON.parse(localStorage.getItem('kilas_paud_posts') || '[]');
        dataTersimpan.splice(index, 1);
        localStorage.setItem('kilas_paud_posts', JSON.stringify(dataTersimpan));
        muatPostingan();
      }
    }

    window.onload = muatPostingan;
  </script>

</body>
</html>
